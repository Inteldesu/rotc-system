<!DOCTYPE html>
<html>
<head>
    <title>ROTC System</title>
</head>
<body>

<h2>ROTC SYSTEM</h2>
<p>User: {{ user }} | Role: {{ role }}</p>

<a href="/logout">Logout</a>

<hr>

<h3>Add Attendance</h3>
<form method="POST" action="/add">
    <input name="name" placeholder="Name" required>
    <input name="rank" placeholder="Rank" required>
    <button type="submit">Add</button>
</form>

<hr>

<h3>Records</h3>
<table border="1">
    <tr>
        {% if role == 'admin' %}<th>User</th>{% endif %}
        <th>Name</th>
        <th>Rank</th>
        <th>Date</th>
    </tr>

    {% for r in records %}
    <tr>
        {% if role == 'admin' %}<td>{{ r.username }}</td>{% endif %}
        <td>{{ r.name }}</td>
        <td>{{ r.rank }}</td>
        <td>{{ r.date }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
